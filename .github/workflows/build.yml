name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release

      - name: Assemble hanstePlayer.app
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          mkdir -p hanstePlayer.app/Contents/MacOS
          cp "$BIN/hanstePlayer" hanstePlayer.app/Contents/MacOS/hanstePlayer
          cp Info.plist hanstePlayer.app/Contents/Info.plist
          codesign --force --deep --sign - hanstePlayer.app
          ditto -c -k --keepParent hanstePlayer.app hanstePlayer-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: hanstePlayer-macOS
          path: hanstePlayer-macOS.zip
