name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Warnung, falls .env im Repo liegt
        run: |
          if [ -f .env ]; then
            echo "::warning::.env liegt im Repo. Secrets entfernen und bei Google neu erzeugen."
          fi

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (release)
        run: swift build -c release

      - name: Assemble YouTube.app
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          mkdir -p YouTube.app/Contents/MacOS
          cp "$BIN/YouTube" YouTube.app/Contents/MacOS/YouTube
          cp Info.plist YouTube.app/Contents/Info.plist
          codesign --force --deep --sign - YouTube.app
          ditto -c -k --keepParent YouTube.app YouTube-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-macOS
          path: YouTube-macOS.zip
